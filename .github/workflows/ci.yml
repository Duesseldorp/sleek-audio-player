name: CI

# Runs on every push and pull request. Catches the mistakes that used to slip
# through until release time (or until a user reported them).

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  php-syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported version (plugin header: Requires PHP 7.4) and a
        # current one - enforces the compatibility promise instead of assuming it
        php: ["7.4", "8.3"]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint all PHP files
        run: find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

  js-syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check all JavaScript files parse
        run: |
          status=0
          for f in assets/js/*.js; do
            if node --check "$f"; then
              echo "ok: $f"
            else
              echo "::error file=$f::Syntax error"
              status=1
            fi
          done
          exit $status

  build-artifacts:
    name: Generated files in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install rjsmin==1.2.5 rcssmin==1.2.2

      - name: Minified assets match their sources
        run: |
          python tools/minify.py
          if ! git diff --exit-code -- assets/js/player.min.js assets/css/player.min.css; then
            echo "::error::player.min.js / player.min.css are out of date. Run 'python tools/minify.py' and commit the result."
            exit 1
          fi

      # A string that never reaches the .pot can never be translated, and
      # nothing at runtime complains about it - the site just shows English.
      - name: Translation template covers every translatable string
        run: |
          if ! python tools/make-pot.py --check; then
            echo "::error::languages/sleek-audio-player.pot is out of date. Run 'python tools/make-pot.py' and commit the result."
            exit 1
          fi

      - name: German translation is complete
        run: |
          python - <<'EOF'
          import re, sys
          pot = open("languages/sleek-audio-player.pot", encoding="utf-8").read()
          po = open("languages/sleek-audio-player-de_DE.po", encoding="utf-8").read()

          def singular_ids(text):
              return set(re.findall(r'^msgid "(.+)"$', text, re.M))

          missing = sorted(singular_ids(pot) - singular_ids(po))
          untranslated = sorted(re.findall(r'^msgid "(.+)"\nmsgstr ""$', po, re.M))
          untranslated += sorted(re.findall(r'^msgid "(.+)"\nmsgid_plural ".*"\nmsgstr\[0\] ""', po, re.M))
          if missing or untranslated:
              for m in missing:
                  print(f"::error::Missing from the German translation: {m}")
              for u in untranslated:
                  print(f"::error::Untranslated in German: {u}")
              sys.exit(1)
          print(f"German translation complete ({len(singular_ids(pot))} strings)")
          EOF

      - name: Compiled translations match their sources
        run: |
          python tools/po2mo.py
          if ! git diff --exit-code -- languages/; then
            echo "::error::.mo files are out of date. Run 'python tools/po2mo.py' and commit the result."
            exit 1
          fi

      - name: Distribution ZIP builds and contains no development files
        run: |
          python tools/build-zip.py
          python - <<'EOF'
          import glob, pathlib, sys, zipfile
          zip_path = glob.glob("dist/sleek-audio-player-*.zip")[0]
          names = zipfile.ZipFile(zip_path).namelist()
          forbidden = ("LICENSE", "SECURITY", "CONTRIBUTING", "CODE_OF_CONDUCT",
                       "DEVELOPMENT", "CLAUDE", "windsurfrules", ".github", "tools/",
                       "readme.md", "tests/", "package.json", "playwright", "wp-env")
          leaks = [n for n in names if any(f in n for f in forbidden)]
          if leaks:
              print(f"::error::Development files leaked into the distribution ZIP: {leaks}")
              sys.exit(1)
          # Every PHP file the plugin requires must actually ship, or the
          # plugin fatals on activation
          required = ["sleek-audio-player.php", "uninstall.php", "readme.txt"]
          required += [f"includes/{p.name}" for p in sorted(pathlib.Path("includes").glob("*.php"))]
          missing = [r for r in required if not any(n.endswith(r) for n in names)]
          if missing:
              print(f"::error::Files missing from the distribution ZIP: {missing}")
              sys.exit(1)
          print(f"{zip_path}: {len(names)} files, clean and complete")
          EOF

  version-consistency:
    name: Version consistent in all four places
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare plugin header, constant, readme.txt and readme.md
        run: |
          header=$(grep -oP '^\s*\*\s*Version:\s*\K[\d.]+' sleek-audio-player.php)
          constant=$(grep -oP "SLEEKAUDIO_VERSION',\s*'\K[\d.]+" sleek-audio-player.php)
          stable=$(grep -oP '^Stable tag:\s*\K[\d.]+' readme.txt)
          current=$(grep -oP '^\*\*Current Version:\*\*\s*\K[\d.]+' readme.md)
          echo "plugin header : $header"
          echo "SLEEKAUDIO_VERSION: $constant"
          echo "readme.txt    : $stable"
          echo "readme.md     : $current"
          if [ "$header" != "$constant" ] || [ "$header" != "$stable" ] || [ "$header" != "$current" ]; then
            echo "::error::Version mismatch - all four locations must match (see DEVELOPMENT.md)."
            exit 1
          fi

  contrast:
    name: Default theme meets contrast minimums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Makes "the default theme meets WCAG AA" a checked fact instead of a
      # claim in the readme. Custom themes cannot be checked - see the script.
      - name: Contrast ratios of the shipped colours
        run: python tools/check-contrast.py

  conventions:
    name: Plugin paths resolved in the main file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only sleek-audio-player.php may derive plugin paths from __FILE__.
      # In includes/ those helpers silently return ".../includes/...", which
      # is how the bundled translations stopped loading in 2.5.7-2.6.0:
      # load_plugin_textdomain() looked in includes/languages/ and found
      # nothing, with no error anywhere. Use the SLEEKAUDIO_* constants.
      - name: No __FILE__-relative plugin paths outside the main file
        run: |
          # Docblocks are allowed to name the trap; only real calls fail.
          hits=$(grep -nE 'plugin_(basename|dir_path|dir_url)\(__FILE__\)|plugins_url\([^)]*__FILE__' includes/*.php \
                 | grep -vE ':[0-9]+:[[:space:]]*(\*|//|/\*)' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::includes/ must not derive plugin paths from __FILE__ - use SLEEKAUDIO_PLUGIN_DIR / _URL / _BASENAME (see DEVELOPMENT.md)."
            exit 1
          fi
          echo "no __FILE__-relative plugin paths in includes/"

      # player.js and admin.js read their strings from PHP via
      # wp_localize_script. A key that exists in the JS but not in PHP renders
      # the English fallback forever, which looks like a translation gap and is
      # invisible to every other check.
      # Plugin Check rejects a placeholder string without a translators
      # comment, and it only says so at the very end of a CI run. This finds
      # it in seconds instead.
      - name: Placeholder strings carry a translators comment
        run: |
          python - <<'EOF'
          import re, sys
          SQ = r"'((?:[^'\\]|\\.)*)'"
          CALL = re.compile(r"\b(?:esc_html__|esc_attr__|esc_html_e|esc_attr_e|__|_e|_n)\(\s*" + SQ)
          COMMENT = re.compile(r"/\*\s*translators:.*?\*/", re.S)
          files = ["sleek-audio-player.php", "uninstall.php",
                   "includes/class-player.php", "includes/class-theme-manager.php",
                   "includes/class-waveform-manager.php"]
          missing = []
          for rel in files:
              src = open(rel, encoding="utf-8").read()
              for m in CALL.finditer(src):
                  if "%" not in m.group(1):
                      continue
                  before = src[:m.start()]
                  # The comment must live inside the SAME <?php ... ?> block as the
                  # call. In an inline <script> a /* translators: */ placed outside
                  # the tags is JavaScript, invisible to PHP's tokenizer - which is
                  # exactly how four of these reached Plugin Check unnoticed.
                  block_start = before.rfind("<?php")
                  comments = [c for c in COMMENT.finditer(before) if c.start() > block_start]
                  ok = comments and CALL.search(src[comments[-1].end():m.start()]) is None
                  if not ok:
                      missing.append((rel, src.count("\n", 0, m.start()) + 1, m.group(1)))
          for rel, line, text in missing:
              print(f"::error file={rel},line={line}::Placeholder string needs a /* translators: */ comment inside the same PHP block: {text}")
          sys.exit(1 if missing else 0)
          EOF

      - name: Every JS translation key exists in PHP
        run: |
          python - <<'EOF'
          import re, sys
          php = open("includes/class-player.php", encoding="utf-8").read()
          failed = False
          for js_file, helper in (("assets/js/player.js", "sapText"),
                                  ("assets/js/admin.js", "sapAdminText")):
              js = open(js_file, encoding="utf-8").read()
              used = set(re.findall(helper + r"\(\s*'([^']+)'", js))
              # Keys are defined as 'key' => __('...') inside the i18n arrays
              defined = set(re.findall(r"'([A-Za-z][A-Za-z0-9]*)'\s*=>\s*__\(", php))
              unknown = sorted(used - defined)
              nofallback = re.findall(helper + r"\(\s*'[^']+'\s*\)", js)
              if unknown:
                  failed = True
                  for k in unknown:
                      print(f"::error::{js_file}: {helper}('{k}') has no matching key in PHP")
              if nofallback:
                  failed = True
                  for c in nofallback:
                      print(f"::error::{js_file}: {c} is missing its English fallback")
              print(f"{js_file}: {len(used)} keys, all defined in PHP")
          sys.exit(1 if failed else 0)
          EOF

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Generate test audio fixtures
        run: npm run fixtures

      - name: Start WordPress (wp-env)
        run: npx wp-env start

      - name: Seed test content
        run: npm run seed

      # Fail in seconds with a clear message if the environment is wrong,
      # instead of burning ~16 minutes on timing-out browser tests.
      - name: Verify the test environment serves a player
        run: |
          for url in /player-page/ /player-mini/ /playlist/e2e-playlist/; do
            body=$(curl -sS -w "\n%{http_code}" "http://localhost:8888$url")
            code=$(echo "$body" | tail -n1)
            if [ "$code" != "200" ]; then
              echo "::error::$url returned HTTP $code - permalinks or seeding are broken"
              echo "--- diagnostics ---"
              npx wp-env run cli wp option get permalink_structure || true
              npx wp-env run wordpress ls -la /var/www/html/.htaccess || echo "no .htaccess"
              npx wp-env run wordpress cat /var/www/html/.htaccess || true
              npx wp-env run wordpress bash -c "apache2ctl -M 2>/dev/null | grep -i rewrite" || echo "mod_rewrite not listed"
              curl -sS -I "http://localhost:8888$url" || true
              exit 1
            fi
            if ! echo "$body" | grep -q "sap-player"; then
              echo "::error::$url returned 200 but contains no player markup"
              exit 1
            fi
            echo "ok: $url"
          done
          # What matters is that no JS/CSS of this plugin is requested. Other
          # mentions of the plugin name in the HTML are reported, not fatal.
          html=$(curl -sS "http://localhost:8888/no-player-page/")
          mentions=$(printf '%s' "$html" | grep -o "sleek-audio-player[^\"'<> ]*" | sort -u || true)
          assets=$(printf '%s' "$mentions" | grep -E "assets/.*\.(js|css)" || true)
          if [ -n "$assets" ]; then
            echo "::error::/no-player-page/ loads plugin assets - conditional loading is broken"
            printf '%s\n' "$assets"
            exit 1
          fi
          if [ -n "$mentions" ]; then
            echo "note: page mentions the plugin without loading assets:"
            printf '  %s\n' $mentions
          fi
          echo "ok: /no-player-page/ loads no plugin assets"

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: WordPress debug log on failure
        if: failure()
        run: npx wp-env run wordpress cat wp-content/debug.log || true

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install rjsmin==1.2.5 rcssmin==1.2.2

      - name: Build a clean plugin directory to scan
        run: |
          python tools/build-zip.py
          mkdir -p build
          unzip -q dist/sleek-audio-player-*.zip -d build

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./build/sleek-audio-player
          # Advisory checks that the plugin deliberately does not follow are
          # excluded; every remaining finding must stay at zero.
          exclude-checks: |
            late_escaping
            plugin_review_phpcs
