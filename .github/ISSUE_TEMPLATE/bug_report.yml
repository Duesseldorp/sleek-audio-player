name: Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this!

        **Security issue?** Please don't post it here — see
        [SECURITY.md](https://github.com/Duesseldorp/sleek-audio-player/blob/main/SECURITY.md).

  - type: textarea
    id: what-happens
    attributes:
      label: What happens?
      description: What did you expect, and what happened instead?
      placeholder: |
        Expected: playback continues with the next track
        Actual: playback stops after the second track
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the page with the player
        2. Start playback
        3. Lock the phone screen
        4. After ~2 tracks the music stops
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Public URL (if available)
      description: A page where the problem can be seen makes fixing it much faster.
      placeholder: https://example.com/my-playlist/

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "2.5.5"
    validations:
      required: true

  - type: input
    id: wp-version
    attributes:
      label: WordPress version
      placeholder: "7.0.3"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Device / browser
      description: For playback issues this is often the decisive detail.
      placeholder: "Samsung Galaxy S23, Chrome 141, Android 15"
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: How is the player embedded?
      options:
        - Shortcode in post/page content
        - Gutenberg block
        - Page builder (Elementor, Divi, WPBakery, …)
        - Widget / theme template
        - iFrame embed on another site
        - Not sure
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Browser console errors
      description: Optional, but very helpful. Open DevTools → Console and paste anything red.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I'm using the latest release of the plugin
          required: true
        - label: I cleared caches (browser and any caching plugin) and the problem persists
          required: true
